name: Build e4maps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # --- SETUP LINUX ---
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libgtkmm-3.0-dev libcairomm-1.0-dev gettext

    # --- SETUP MACOS ---
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake pkg-config gtkmm3 gettext create-dmg
        echo "CMAKE_PREFIX_PATH=$(brew --prefix gettext)" >> $GITHUB_ENV

    # --- SETUP WINDOWS (MSYS2) ---
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gtkmm3
          mingw-w64-x86_64-cairomm
          mingw-w64-x86_64-gettext
          base-devel

    # --- BUILD (Common) ---
    - name: Configure CMake
      if: runner.os != 'Windows'
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      if: runner.os != 'Windows'
      run: cmake --build build --config Release --parallel 4

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: cmake --build build --config Release --parallel 4

    # --- SCREENSHOT (macOS ONLY) ---
    - name: Run and Screenshot (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        echo "Starting app for screenshot..."
        ./build/e4maps &
        APP_PID=$!
        sleep 15
        screencapture -x screenshot-macos.png
        kill $APP_PID || true
        mkdir -p distMac/screenshots
        mv screenshot-macos.png distMac/screenshots/

    # --- PACKAGING (macOS) ---
    - name: Package macOS App & DMG
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x createMacBundle.sh
        ./createMacBundle.sh

    # --- PACKAGING (Windows) ---
    - name: Package Windows App
      if: matrix.os == 'windows-latest'
      shell: msys2 {0}
      run: |
        chmod +x package_app_for_windows.sh
        ./package_app_for_windows.sh

    # --- PACKAGING (Linux) ---
    - name: Prepare Artifacts (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir -p dist
        cp build/e4maps dist/
        cp LICENSE dist/
        cp README.md dist/

    # --- UPLOAD ARTIFACTS ---
    - name: Upload Artifact (macOS)
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: e4maps-macOS-Package
        path: |
          distMac/*.dmg
          distMac/screenshots/*.png

    - name: Upload Artifact (Windows)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: e4maps-Windows-Portable
        path: distWin/

    - name: Upload Artifact (Linux)
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: e4maps-Linux-bin
        path: dist/
