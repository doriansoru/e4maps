name: Build e4maps

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # --- SETUP LINUX ---
    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config libgtkmm-3.0-dev libcairomm-1.0-dev gettext

    # --- SETUP MACOS ---
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install cmake pkg-config gtkmm3 gettext
        # We need to set the prefix path for gettext as it's keg-only
        echo "CMAKE_PREFIX_PATH=$(brew --prefix gettext)" >> $GITHUB_ENV

    # --- SETUP WINDOWS (MSYS2) ---
    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: >
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-cmake
          mingw-w64-x86_64-pkg-config
          mingw-w64-x86_64-make
          mingw-w64-x86_64-gtkmm3
          mingw-w64-x86_64-cairomm
          mingw-w64-x86_64-gettext

    # --- BUILD ---
    - name: Configure CMake
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          # Use MSYS2 cmake
          cmake -G "MinGW Makefiles" -B build -DCMAKE_BUILD_TYPE=Release
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi

    - name: Build
      run: cmake --build build --config Release --parallel 4

    # --- PACKAGING (Artifacts) ---
    - name: Prepare Artifacts (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p dist
        cp build/e4maps dist/
        # Copy license and readme if desired
        cp LICENSE dist/
        cp README.md dist/

    - name: Prepare Artifacts (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        mkdir -p dist
        cp build/e4maps.exe dist/
        cp LICENSE dist/
        cp README.md dist/
        # Note: DLLs are NOT collected here. Users would need to run this in MSYS2 environment
        # or use a tool to bundle DLLs. This just provides the raw executable.

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: e4maps-${{ matrix.os }}
        path: dist/
